services:
  - type: web
    name: contract-farming-cfms
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && cd client && npm install --include=dev && npm run build
    startCommand: node server/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false
